[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leg-member-statements"
version = "0.1.0"
description = "Monthly member statements for Swiss local electricity communities (LEG) and virtual self-consumption groups: 15-minute meter data in, allocation, tariffs, CSV and one-page PDF out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VB-Builds" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "reportlab>=4.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pypdf>=4", "pypdfium2>=4"]

[project.scripts]
leg-statements = "leg_statements.cli:main"

[tool.setuptools.packages.find]
include = ["leg_statements*"]

[tool.setuptools.package-data]
leg_statements = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
